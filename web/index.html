<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sweeper - Deep Clean Your Dev Machine</title>
    <meta name="description" content="The most powerful open-source disk cleaning tool for developers. Instantly reclaim space from node_modules, Rust crates, and build artifacts." />
    <meta name="keywords" content="disk cleanup, developer tools, node_modules, rust, build artifacts, zig, cross-platform" />
    <meta property="og:title" content="Sweeper - Deep Clean Your Dev Machine" />
    <meta property="og:description" content="The most powerful open-source disk cleaning tool for developers." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://augani.github.io/sweeper/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
            },
            colors: {
              background: '#ffffff',
              surface: '#f4f4f5', /* zinc-100 */
              primary: '#dc2626', /* red-600 */
              secondary: '#991b1b', /* red-800 */
              accent: '#ef4444', /* red-500 */
              dark: '#09090b', /* zinc-950 for contrast elements */
            },
            animation: {
              'blob': 'blob 7s infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              }
            }
          },
        },
      }
    </script>
    <style>
      body {
        background-color: #ffffff;
        color: #18181b;
      }
      /* Custom scrollbar for the app mock */
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #d4d4d8;
        border-radius: 20px;
      }
    </style>

}
